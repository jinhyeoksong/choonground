<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>춘그라운드 2.0</title>
<style>
  @font-face { font-family:'Tomorrow'; src:url('assets/fonts/tomorrow-v19-latin-500.woff2') format('woff2'); font-weight:500; font-style:normal; font-display:swap; }
  @font-face { font-family:'Tomorrow'; src:url('assets/fonts/tomorrow-v19-latin-600.woff2') format('woff2'); font-weight:600; font-style:normal; font-display:swap; }
  @font-face { font-family:'Tomorrow'; src:url('assets/fonts/tomorrow-v19-latin-700.woff2') format('woff2'); font-weight:700; font-style:normal; font-display:swap; }
  @font-face { font-family:'Tomorrow'; src:url('assets/fonts/tomorrow-v19-latin-800.woff2') format('woff2'); font-weight:800; font-style:normal; font-display:swap; }
  @font-face { font-family:'Tomorrow'; src:url('assets/fonts/tomorrow-v19-latin-900.woff2') format('woff2'); font-weight:900; font-style:normal; font-display:swap; }
  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
  }
  html, body, .phone, .screen, .playArea {
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
    touch-action: none;
    overscroll-behavior: none;
  }

  img, svg, canvas {
    -webkit-user-drag: none;
    user-drag: none;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
    pointer-events: none;
  }

  body { margin:0; min-height:100vh; display:flex; justify-content:center; align-items:center; background:#2f2f2f; font-family:'Tomorrow', system-ui, -apple-system, BlinkMacSystemFont, sans-serif; color:#10151f; overflow:hidden; }
  .phone { width:393px; height:844px; max-width:100vw; max-height:100vh; position:relative; overflow:hidden; background-color: #B7E4FF; box-shadow:0 24px 72px rgba(0,0,0,.35); }
  .screen { position:absolute; inset:0; display:none; }
  .screen.active { display:block; }
  #gameScreen.resultMode .player,
  #gameScreen.resultMode .player img {
    display: none !important;
    visibility: hidden !important;
    opacity: 0 !important;
  }
  
  /* 결과/연동 화면용 상단바 (기존 유지) */
  .topbar { position:absolute; top:0; left:0; right:0; height:50px; display:flex; align-items:center; justify-content:space-between; padding:0 16px; font-weight:900; z-index:20; }
  .topbar .back { font-size:26px; }
  .topbar .share { font-size:24px; transform:rotate(-45deg); }
  
  /* 신규: 메인 대기실(로비) 전용 레이어 */
  #lobbyScreen {
    position: absolute;
    inset: 0;
    background: url('assets/image_184d66.webp') no-repeat center center;
    background-size: cover;
    z-index: 90;
    display: none; /* 디폴트는 보이지 않게 처리하여 스타일 꼬임 및 화면 잠김 방지 */
    flex-direction: column;
    justify-content: flex-end;
    padding: 40px 20px;
  }
  
  /* active 클래스가 붙었을 때만 플렉스 상자로 전면 노출 */
  #lobbyScreen.active {
    display: flex !important;
  }

  /* 결과 화면의 .resultBtn .resultBtnRetry 양식과 오차 없이 100% 매칭 (그림자 완전 제거) */
  .lobbyBtn {
    width: 100%;
    height: 60px;
    border: 0;
    border-radius: 10px;
    font-family: 'Pretendard', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 18px;
    line-height: 1;
    font-weight: 600;
    color: #111111;
    background: #FFE11F;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: none !important; /* 그림자 완전 제거 */
    outline: none;
    transition: transform 0.1s ease;
  }

  .lobbyBtn:active {
    transform: scale(0.98); /* 누를 때의 가벼운 수축 피드백 유지 */
  }
  
  /* 게임 뒤로가기 버튼: SVG 이미지 사용 */
  #quitBtn {
    position: absolute;
    top: 21px;
    left: 14px;
    width: 24px;
    height: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 30;
    cursor: pointer;
    background: transparent;
  }

  #quitBtn img {
    width: 24px;
    height: 24px;
    display: block;
    object-fit: contain;
  }
  
  .cloud { position:absolute; background:#fff; border-radius:999px; opacity:.82; }
  .cloud::before,.cloud::after { content:''; position:absolute; background:#fff; border-radius:50%; }
  .cloud.c1 { width:80px; height:28px; top:170px; left:28px; }
  .cloud.c1::before { width:42px; height:42px; left:12px; top:-24px; } .cloud.c1::after { width:36px; height:36px; right:8px; top:-18px; }
  .cloud.c2 { width:82px; height:28px; top:315px; right:32px; opacity:.74; }
  .cloud.c2::before { width:38px; height:38px; left:13px; top:-22px; } .cloud.c2::after { width:34px; height:34px; right:10px; top:-17px; }
  .cloud.c3 { width:54px; height:20px; top:455px; left:88px; opacity:.55; }
  .cloud.c3::before { width:27px; height:27px; left:9px; top:-15px; } .cloud.c3::after { width:24px; height:24px; right:7px; top:-12px; }
  
  /* HUD 위치 및 컴포넌트 세팅 */
  .hud { 
    position: absolute; 
    left: 16px;         
    top: 74px;          
    z-index: 30; 
  }
  .pills { display: flex; align-items: center; }
  .pill { 
    width: 118px;       
    height: 46px;       
    border-radius: 999px; 
    background: #FFFFFF; 
    display: flex; 
    align-items: center; 
    justify-content: center; 
    padding: 0;         
    box-shadow: none;
    position: relative;   
  }
  
  /* 시작 위치 정중앙을 기준으로 1.3배 확대 고정 */
  .pill img { 
    width: 25px;   
    height: 22px;   
    object-fit: contain;
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%) scale(1.3); /* pill 좌측 기준 12px 고정 */
  }
  
  /* 오른쪽 이동 오프셋을 완전히 제거하고 순수 정렬 위치에 고정 */
  #boxCountText {
    font-family: 'Tomorrow', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    font-weight: 700;   
    font-size: 22px;    
    line-height: 1;
    color: #111111;     
    letter-spacing: 0;
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%); /* pill 우측 기준 12px 고정 */
  }

  .lifeHud {
    position: absolute;
    top: 85px;
    right: 20px;
    width: 72px;
    height: 31px;
    z-index: 30;
    pointer-events: none;
  }
  .lifeIcon {
    position: absolute;
    left: 0;
    top: 0;
    width: 34px;
    height: 31px;
    object-fit: contain;
    display: block;
  }
  .lifeX {
    position: absolute;
    left: 42px;
    top: calc(50% - 2px);
    transform: translateY(-50%);
    font-family: 'Tomorrow', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 20px;
    line-height: 1;
    font-weight: 700;
    color: #111111;
  }
  #lifeCountText {
    position: absolute;
    left: 58px;
    top: 50%;
    transform: translateY(-50%);
    font-family: 'Tomorrow', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 20px;
    line-height: 1;
    font-weight: 700;
    color: #111111;
  }

  /* 하단 및 기존 스크린 스타일 전체 유지 */
  .scoreTitle { font-size:13px; font-weight:1000; letter-spacing:.5px; opacity:.8; }
  .scoreValue { font-family:Tomorrow,Impact,sans-serif; font-size:39px; line-height:1; font-weight:900; }
  .positionHud { min-width:86px; color:#1f2933; text-transform:uppercase; }
  .positionDir { font-size:19px; line-height:1.02; font-weight:1000; letter-spacing:.6px; }
  .positionPercent { font-family:Tomorrow,Impact,sans-serif; font-size:33px; line-height:.96; font-weight:900; letter-spacing:-.5px; }
  
  .feverBadge {
    position:absolute; top:37%; left:50%; transform:translate(-50%,-50%) scale(.9);
    display:none; align-items:center; justify-content:center; z-index:55; pointer-events:none; white-space:nowrap;
  }
  .feverBadge.on { display:flex; animation:feverTextPop 1.05s ease-out forwards; }
  .feverSvg { width:270px; height:96px; display:block; overflow:visible; }
  .feverSvg text {
    font-family:'Tomorrow', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    font-size:62px;
    font-weight:700;
    fill:#A662EA;
    stroke:#FFFFFF;
    stroke-width:8px;
    stroke-linejoin:round;
    stroke-linecap:round;
    paint-order:stroke fill;
    dominant-baseline:middle;
    text-anchor:middle;
  }

  /* ★ 노란색 레벨 토스트 팝업을 화면에서 절대 표시되지 않도록 숨김 처리 */
  .levelBadge { display: none !important; }
  
  @keyframes levelUp { 0%{ transform:translateX(-50%) scale(.75); opacity:0; } 25%{ transform:translateX(-50%) scale(1.18); opacity:1; } 100%{ transform:translateX(-50%) scale(1); opacity:.9; } }
  @keyframes feverTextPop { 0%{ opacity:0; transform:translate(-50%,-42%) scale(.5); } 16%{ opacity:1; transform:translate(-50%,-50%) scale(1.08); } 72%{ opacity:1; transform:translate(-50%,-50%) scale(1); } 100%{ opacity:0; transform:translate(-50%,-58%) scale(.96); } }
  
  .playArea { position:absolute; inset:0; overflow:hidden; touch-action:none; -webkit-user-select:none; user-select:none; }
  .playArea img { pointer-events:none; }
  .laneHint { display:none !important; }
  .player { position:absolute; width:92px; height:114px; left:0; bottom:42px; z-index:18; transform-origin:50% 100%; will-change: transform; pointer-events:none; }
  .player img { width:100%; height:100%; object-fit:contain; display:block; pointer-events:none; }
  .player.hit { animation:hitShake .45s ease-out; }
  @keyframes hitShake { 0%,100%{ translate:0 0; } 20%{ translate:-8px 0; } 40%{ translate:8px 0; } 60%{ translate:-6px 0; } 80%{ translate:6px 0; } }
  
  .object { position:absolute; z-index:14; will-change:transform; display:none; }
  .object img { width:100%; height:100%; object-fit:contain; pointer-events:none; }
  
  /* 1단계 고정 틸트 기준축 매치 */
  .box { width:42px; height:52px; transform-origin: 50% 15px; } 
  .gold { width:31px; height:53px; } .mouse { width:45px; height:63px; }
  
  .comboCenter { position:absolute; left:50%; top:37%; transform:translate(-50%,-50%); z-index:50; pointer-events:none; display:none; text-align:center; min-width:120px; }
  .comboCenter.show { display:block; animation:comboPop .82s ease-out forwards; }
  .comboSvg { width:170px; height:132px; display:block; overflow:visible; }
  .comboSvg text {
    font-family:'Tomorrow', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    fill:#4C75FC;
    stroke:#FFFFFF;
    stroke-linejoin:round;
    stroke-linecap:round;
    paint-order:stroke fill;
    dominant-baseline:middle;
    text-anchor:middle;
  }
  .comboSvgNum { font-size:72px; font-weight:600; stroke-width:8px; }
  .comboSvgText { font-size:25px; font-weight:700; stroke-width:6px; }
  @keyframes comboPop { 0%{ opacity:0; transform:translate(-50%,-40%) scale(.55); } 18%{ opacity:1; transform:translate(-50%,-50%) scale(1.08); } 62%{ opacity:1; transform:translate(-50%,-50%) scale(1); } 100%{ opacity:0; transform:translate(-50%,-64%) scale(.98); } }
  
  /* 마리오 코인 획득 방식처럼 중심에서 영롱하게 팝-투명 링으로 퍼지는 글로우 트윙클 연출 */
  .pickupEffect { position:absolute; left:0; top:0; width:58px; height:58px; z-index:60; pointer-events:none; transform:translate(-50%,-50%) scale(.7); animation:pickupBurst 0.45s ease-out forwards; }
  .pickupEffect img { width:100%; height:100%; object-fit:contain; display:block; pointer-events:none; }
  .feverAutoPickupEffect { position:absolute; left:0; top:0; width:64px; height:64px; z-index:60; pointer-events:none; transform:translate(-50%,-50%) scale(.8); animation:feverAutoPickupBurst 1.05s ease-out forwards; }
  .feverAutoPickupEffect img { width:100%; height:100%; object-fit:contain; display:block; pointer-events:none; }
  @keyframes pickupBurst {
    0% { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
    25% { opacity: 1; transform: translate(-50%, -50%) scale(1.15); }
    100% { opacity: 0; transform: translate(-50%, -50%) scale(1.35); }
  }
  @keyframes feverAutoPickupBurst {
    0% {
      opacity:0;
      transform:translate(-50%,-50%) scale(.95);
      filter:brightness(1.2);
    }
    12% {
      opacity:1;
      transform:translate(-50%,-50%) scale(1);
      filter:brightness(1.9);
    }
    45% {
      opacity:1;
      transform:translate(-50%,-56%) scale(1.02);
      filter:brightness(1.45);
    }
    75% {
      opacity:.65;
      transform:translate(-50%,-68%) scale(1.04);
      filter:brightness(1.15);
    }
    100% {
      opacity:0;
      transform:translate(-50%,-82%) scale(1.06);
      filter:brightness(1);
    }
  }

  .feverFlash { position:absolute; inset:0; opacity:0; pointer-events:none; z-index:26; mix-blend-mode:screen; background: radial-gradient(circle at 50% 52%, rgba(255,245,66,.55), transparent 35%), linear-gradient(135deg, rgba(255,232,0,.25), rgba(255,119,0,.22), rgba(255,255,255,.12)); }
  .feverFlash.on { opacity:1; animation:feverStrobe .22s ease-in-out infinite alternate; }
  .feverFlash.on::after { content:''; position:absolute; inset:-20%; background:radial-gradient(circle, rgba(255,255,255,.9) 0 2px, transparent 3px); background-size:58px 58px; animation:feverSparkle .5s steps(2,end) infinite; opacity:.65; }
  @keyframes feverStrobe { from{ opacity:.18; filter:saturate(1.1) brightness(1); } to{ opacity:.58; filter:saturate(1.65) brightness(1.18); } }
  @keyframes feverSparkle { 0%{ transform:translate(0,0) scale(1); } 100%{ transform:translate(22px,18px) scale(1.04); } }
  
  .skyCloud { position:absolute; left:0; top:0; pointer-events:none; z-index:4; opacity:.34; will-change:transform; }
  .skyCloud img { width:100%; height:auto; display:block; }
  .skyCloud.big-left { width:205px; opacity:.42; }
  .skyCloud.small-top { width:120px; opacity:.32; }
  .skyCloud.small-mid { width:120px; opacity:.34; }
  .skyCloud.big-right { width:190px; opacity:.30; }

  /* index.html과 같은 위치의 assets 폴더 사용 */
  .mountain-bg { position: absolute; left: 0; bottom: 85px; width: 100%; height: 248px; background: url('assets/bg_mountain.webp') no-repeat bottom left; background-size: 1179px auto; z-index: 5; will-change: background-position-x; }
  .ground { position: absolute; left: 0; bottom: 0; width: 100%; height: 85px; background: url('assets/bg_ground.webp') repeat-x bottom left; background-size: 393px 85px; z-index: 10; will-change: background-position-x; }

  /* result */
  .panel { position:absolute; left:20px; right:20px; top:118px; background:rgba(255,255,255,.94); border-radius:28px; padding:28px 22px; box-shadow:0 20px 48px rgba(0,0,0,.08); text-align:center; }
  .resultTitle { font-size:34px; font-weight:1000; margin-bottom:12px; }
  .resultScore { font-family:'Tomorrow', system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size:52px; font-weight:900; }
  .resultMeta { margin-top:12px; font-weight:900; color:#41505c; line-height:1.7; }
  .grade { margin:18px auto 6px; display:inline-flex; padding:12px 18px; border-radius:999px; background:#fff3a6; font-weight:1000; }
  .resultChunsik { width:120px; margin:20px auto 4px; filter:drop-shadow(0 10px 14px rgba(0,0,0,.12)); }
  .smallBtn { position:absolute; left:16px; right:16px; bottom:152px; height:56px; border:0; border-radius:15px; background:#e9ff00; color:#111; font-size:18px; font-weight:1000; cursor:pointer; }
  .darkBtn { position:absolute; left:16px; right:16px; bottom:82px; height:62px; border:0; border-radius:15px; background:#0e131b; color:#fff; font-size:19px; font-weight:1000; cursor:pointer; }
  .saved { font-size:20px; font-weight:1000; line-height:1.55; color:#26313f; }

  /* V19 result screen */
  .resultScene { overflow: hidden; background: transparent; z-index: 80; }
  .resultScene::before { content: ''; position: absolute; inset: 0; z-index: 0; background: rgba(0, 0, 0, .5); pointer-events: none; }
  .resultCard {
    position: absolute; left: 20px; right: 20px; top: 50%; height: 290px; z-index: 5; transform: translateY(-50%); background: #FFFFFF; border-radius: 28px; padding: 35px 50px 38px; text-align: center; font-family: 'Pretendard', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
  }
  .resultCardTitle { margin: 0; font-family: 'Pretendard', system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 26px; line-height: 1; font-weight: 700; letter-spacing: -1px; color: #111111; }
  .resultSupplyTotal { margin-top: 32px; display: flex; align-items: center; justify-content: center; gap: 13px; }
  .resultSupplyIcon { width: 50px; height: 50px; object-fit: contain; display: block; }
  #finalSupplyCount { font-family: 'Pretendard', system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 48px; line-height: 1; font-weight: 700; letter-spacing: -1.5px; color: #111111; }
  .resultStats { margin-top: 40px; display: grid; gap: 13px; }
  .resultStatRow { display: flex; align-items: center; justify-content: space-between; font-family: 'Pretendard', system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 18px; line-height: 1; font-weight: 600; color: #202020; }
  .resultStatValue { font-weight: 600; }
  .resultButtons { position: absolute; left: 20px; right: 20px; bottom: 40px; display: grid; grid-template-columns: 130px 1fr; gap: 12px; z-index: 8; }
  .resultBtn { height: 60px; border: 0; border-radius: 10px; font-family: 'Pretendard', system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 18px; line-height: 1; font-weight: 600; cursor: pointer; }
  button, #quitBtn { pointer-events: auto; touch-action: manipulation; -webkit-user-select: none; user-select: none; }
  .resultBtnMain { background: #2D3769; color: #FFFFFF; }
  .resultBtnRetry { background: #FFE11F; color: #111111; }

  @media (max-width: 600px) {
    html, body { width: 100%; min-height: 100%; height: 100dvh; overflow: hidden; background: #8bdcff; overscroll-behavior: none; }
    body { display: flex; justify-content: center; align-items: flex-end; padding: 0; margin: 0; position: fixed; inset: 0; }
    .phone { width: 393px; height: 844px; max-width: none; max-height: none; border-radius: 0; margin: 0; transform-origin: center bottom; }
    .hud { top: calc(var(--mobile-ui-offset, 0px) + 74px); }
    .lifeHud { top: calc(var(--mobile-ui-offset, 0px) + 85px); }
  }
</style>
</head>
<body>
  <div class="phone" id="phone">
    
    <!-- 로비 스크린 (첫 진입 화면) -->
    <section id="lobbyScreen" class="screen active">
      <button class="lobbyBtn" id="lobbyStartBtn">게임 시작하기</button>
    </section>
    
    <section id="gameScreen" class="screen">
      <div class="playArea" id="playArea">
        <div class="feverFlash" id="feverFlash"></div>
        <div class="skyCloud big-left" data-x="-95" data-y="225" data-parallax="1"><img src="assets/bg_cloud_large.png" alt="" /></div>
        <div class="skyCloud small-top" data-x="460" data-y="64" data-parallax="1"><img src="assets/bg_cloud_small.png" alt="" /></div>
        <div class="skyCloud small-mid" data-x="830" data-y="300" data-parallax="1"><img src="assets/bg_cloud_small.png" alt="" /></div>
        <div class="skyCloud big-right" data-x="1095" data-y="5" data-parallax="1"><img src="assets/bg_cloud_large.png" alt="" /></div>
        <div class="mountain-bg" id="mountainBg"></div>
        <div class="ground" id="ground"></div>
      </div>
      
      <div id="quitBtn">
        <img src="assets/icon_back.svg" alt="뒤로가기" />
      </div>

      <div class="hud">
        <div class="pills">
          <div class="pill">
            <img src="assets/item_supply.png"/> 
            <span id="boxCountText">0</span>
          </div>
        </div>
      </div>
      <div class="lifeHud" id="lifeHud">
        <img src="assets/life_icon.png" class="lifeIcon" alt="목숨" />
        <span class="lifeX">x</span>
        <span id="lifeCountText">3</span>
      </div>
      
      <div class="feverBadge" id="feverBadge">
        <svg class="feverSvg" viewBox="0 0 270 96" aria-hidden="true">
          <text x="135" y="50">FEVER!</text>
        </svg>
      </div>
      <div class="levelBadge" id="levelBadge">LV.1</div>
      <div class="comboCenter" id="comboCenter">
        <svg class="comboSvg" viewBox="0 0 170 132" aria-hidden="true">
          <text class="comboSvgNum" id="comboNum" x="85" y="50">1</text>
          <text class="comboSvgText" x="85" y="95">COMBO</text>
        </svg>
      </div>
      <div class="player" id="player"><img src="assets/player_idle.webp" alt="춘식이"/></div>
    </section>

    <section id="result" class="screen resultScene">
      <div class="resultCard">
        <h2 class="resultCardTitle">보급 완료</h2>
        <div class="resultSupplyTotal">
          <img class="resultSupplyIcon" src="assets/result_supply_box.png" alt="보급상자" />
          <b id="finalSupplyCount">0</b>
        </div>
        <div class="resultStats">
          <div class="resultStatRow">
            <span>COMBO</span>
            <b class="resultStatValue" id="finalComboCount">0개</b>
          </div>
          <div class="resultStatRow">
            <span>FEVER</span>
            <b class="resultStatValue" id="finalFeverCount">0회</b>
          </div>
        </div>
      </div>
      <div class="resultButtons">
        <button class="resultBtn resultBtnMain" id="mainBtn">메인</button>
        <button class="resultBtn resultBtnRetry" id="retryBtn">재도전</button>
      </div>
    </section>

    <section id="save" class="screen">
      <div class="cloud c1"></div><div class="cloud c2"></div>
      <div class="topbar"><div class="back">‹</div><div class="share">↗</div></div>
      <div class="panel">
        <div class="resultTitle">보상 저장</div>
        <img class="resultChunsik" src="assets/hero_character.png" />
        <div class="saved">카카오 계정으로 로그인하고<br/>배그 계정에 보상을 저장하세요.</div>
      </div>
      <button class="darkBtn" id="completeBtn">계정 연동하고 저장하기</button>
    </section>

    <section id="complete" class="screen">
      <div class="cloud c1"></div><div class="cloud c2"></div>
      <div class="topbar"><div class="back">‹</div><div class="share">↗</div></div>
      <div class="panel">
        <div class="resultTitle">저장 완료!</div>
        <img class="resultChunsik" src="assets/hero_character.png" />
        <div class="saved">배그 춘식이 스킨 보상은<br/>게임 내 우편함에서 확인할 수 있습니다.</div>
      </div>
      <button class="darkBtn" id="againBtn">처음으로</button>
    </section>
  </div>
<script>
(() => {
  document.addEventListener('contextmenu', e => e.preventDefault());
  document.addEventListener('dragstart', e => e.preventDefault());
  document.addEventListener('selectstart', e => e.preventDefault());
  document.addEventListener('gesturestart', e => e.preventDefault());
  document.addEventListener('gesturechange', e => e.preventDefault());
  document.addEventListener('touchstart', e => e.preventDefault(), { passive: false });
  document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
  document.addEventListener('touchend', e => e.preventDefault(), { passive: false });

  /* index.html과 같은 위치의 assets 폴더 사용 */
  const ASSETS = { chunsik:'assets/player_character.png', box:'assets/item_supply_drop.png', gold:'assets/item_fever.png', mouse:'assets/obstacle_hazard.png', effect:'assets/fx_pickup.png' };
  const $ = (id) => document.getElementById(id);
  const screens = ['lobbyScreen','gameScreen','result','save','complete'].map($);
  const show = (id) => { screens.forEach(s=>s.classList.remove('active')); $(id).classList.add('active'); };

  const playArea = $('playArea');
  const playerEl = $('player');
  const playerImg = playerEl.querySelector('img');
  const PLAYER_RUN_SRC = 'assets/player_run.webp';
  const PLAYER_IDLE_SRC = 'assets/player_idle.png';
  const PLAYER_HIT_SRC = 'assets/player_hit.webp';
  const positionDirText = $('positionDir');
  const positionPercentText = $('positionPercent');
  const boxCountText = $('boxCountText');
  const lifeCountText = $('lifeCountText');
  const comboCenter = $('comboCenter');
  const comboNum = $('comboNum');
  const feverBadge = $('feverBadge');
  const feverFlash = $('feverFlash');
  const levelBadge = $('levelBadge');
  const phoneEl = $('phone');
  const skyCloudEls = Array.from(document.querySelectorAll('.skyCloud'));

  const SCREEN_W = 393;
  const SCREEN_H = 844;
  const WORLD_W = Math.round(SCREEN_W * 3.0);
  const CAMERA_MAX_X = WORLD_W - SCREEN_W;
  let cameraX = CAMERA_MAX_X / 2;

  /* ==========================================================================
     🎵 Web Audio API 기반 Chiptune 사운드 신시사이저 엔진
     ========================================================================== */
  let audioCtx = null;
  let masterGain = null;

  function initAudio() {
    if (audioCtx) return;
    try {
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AudioContextClass();
      masterGain = audioCtx.createGain();
      // 모바일에서도 들리되 피로하지 않도록 전체 효과음 볼륨을 안정적으로 세팅
      masterGain.gain.setValueAtTime(0.32, audioCtx.currentTime); 
      masterGain.connect(audioCtx.destination);
    } catch (e) {
      console.warn("Web Audio API not supported in this browser.", e);
    }
  }

  function ensureAudio() {
    initAudio();
    if (audioCtx && audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
  }

  // 기분 좋은 효과음 재생 톤 제네레이터
  function playTone(freq, type, duration, vol = 0.35) {
    if (!audioCtx) return;
    try {
      const osc = audioCtx.createOscillator();
      const gainNode = audioCtx.createGain();
      
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      
      gainNode.gain.setValueAtTime(vol, audioCtx.currentTime);
      gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      
      osc.connect(gainNode);
      gainNode.connect(masterGain);
      
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    } catch (e) {}
  }

  function playSweep(startFreq, endFreq, type, duration, vol = 0.28) {
    if (!audioCtx) return;
    try {
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gainNode = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(startFreq, now);
      osc.frequency.exponentialRampToValueAtTime(endFreq, now + duration);
      gainNode.gain.setValueAtTime(vol, now);
      gainNode.gain.exponentialRampToValueAtTime(0.001, now + duration);
      osc.connect(gainNode);
      gainNode.connect(masterGain);
      osc.start(now);
      osc.stop(now + duration);
    } catch (e) {}
  }

  function playNoise(duration = 0.12, vol = 0.22, filterFreq = 900) {
    if (!audioCtx) return;
    try {
      const sampleRate = audioCtx.sampleRate;
      const buffer = audioCtx.createBuffer(1, Math.max(1, Math.floor(sampleRate * duration)), sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < data.length; i++) {
        data[i] = (Math.random() * 2 - 1) * (1 - i / data.length);
      }
      const source = audioCtx.createBufferSource();
      const filter = audioCtx.createBiquadFilter();
      const gainNode = audioCtx.createGain();
      source.buffer = buffer;
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(filterFreq, audioCtx.currentTime);
      gainNode.gain.setValueAtTime(vol, audioCtx.currentTime);
      gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      source.connect(filter);
      filter.connect(gainNode);
      gainNode.connect(masterGain);
      source.start();
      source.stop(audioCtx.currentTime + duration);
    } catch (e) {}
  }

  // 버튼 클릭: 짧고 가벼운 톡 사운드
  function playButtonSfx() {
    ensureAudio();
    playTone(880, 'triangle', 0.055, 0.16);
    setTimeout(() => playTone(1174.66, 'triangle', 0.045, 0.10), 38);
  }

  // 게임 시작: 버튼 톡 이후 밝게 올라가는 시작음
  function playGameStartSfx() {
    ensureAudio();
    [523.25, 659.25, 783.99].forEach((freq, index) => {
      setTimeout(() => playTone(freq, 'triangle', 0.12, 0.18), index * 70);
    });
  }

  // 콤보 표시: 3콤보 이상부터 UI 팝업과 같이 살짝 강조
  function playComboSfx(comboCount) {
    ensureAudio();
    const root = 783.99 * Math.pow(2, Math.min(comboCount, 12) / 24);
    playTone(root, 'square', 0.075, 0.12);
    setTimeout(() => playTone(root * 1.25, 'square', 0.075, 0.09), 42);
  }

  // 장애물 충돌 및 목숨 감소: 낮고 짧은 둔탁음 + 노이즈
  function playHitSfx() {
    ensureAudio();
    playNoise(0.13, 0.22, 700);
    playSweep(220, 92, 'sawtooth', 0.16, 0.18);
  }

  // 게임오버: 아래로 떨어지는 짧은 마무리 사운드
  function playGameOverSfx() {
    ensureAudio();
    [392.00, 329.63, 261.63, 196.00].forEach((freq, index) => {
      setTimeout(() => playTone(freq, 'triangle', 0.18, 0.16), index * 115);
    });
  }

  // 보급상자 획득: 기존 중첩음을 제거하고 단일 팝 사운드만 사용
  function playBoxSfx(comboCount) {
    ensureAudio();
    const baseFreq = 740;
    const step = Math.min(comboCount, 10) * 18;
    playTone(baseFreq + step, 'triangle', 0.09, 0.18);
  }

  // 피버 아이템 획득: 짧은 상승음 3개만 사용해 기존 아르페지오 중첩을 줄임
  function playGoldSfx() {
    ensureAudio();
    [784, 988, 1319].forEach((freq, index) => {
      setTimeout(() => playTone(freq, 'triangle', 0.11, 0.16), index * 55);
    });
  }

  // 피버 종료 자동 흡수: 기존 연속 다발음 대신 부드러운 짧은 상승음 1회만 재생
  function playVacuumChainSfx(count) {
    ensureAudio();
    if (count <= 0) return;
    playTone(880, 'sine', 0.08, 0.12);
    setTimeout(() => playTone(1175, 'sine', 0.08, 0.10), 70);
  }

  /* ==========================================================================
     🎮 뷰포트 피팅 및 기기 최적화 스케일링 설정
     ========================================================================== */
  function updatePhoneScale() {
    if (!phoneEl) return;
    const isMobile = window.matchMedia('(max-width: 600px)').matches;
    if (!isMobile) {
      phoneEl.style.transform = '';
      phoneEl.style.removeProperty('--mobile-ui-offset');
      return;
    }
    const viewportW = window.innerWidth || document.documentElement.clientWidth || SCREEN_W;
    const viewportH = window.innerHeight || document.documentElement.clientHeight || SCREEN_H;
    const scale = viewportW / SCREEN_W;
    const shiftY = 30;
    const phoneTop = viewportH - (SCREEN_H * scale) + shiftY;
    const mobileUiOffset = Math.max(0, Math.ceil(-phoneTop / scale));
    phoneEl.style.setProperty('--mobile-ui-offset', mobileUiOffset + 'px');
    phoneEl.style.transform = `translateY(${shiftY}px) scale(${scale})`;
  }

  window.addEventListener('resize', updatePhoneScale);
  window.addEventListener('orientationchange', () => setTimeout(updatePhoneScale, 120));

  function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

  function updateCamera() {
    cameraX = clamp(player.x - SCREEN_W / 2, 0, CAMERA_MAX_X);
  }

  function setGameBackgroundMode(isExtended) {
    if (!phoneEl) return;
    if (isExtended) {
      phoneEl.style.backgroundSize = WORLD_W + 'px ' + SCREEN_H + 'px';
      phoneEl.style.backgroundPosition = (-cameraX) + 'px center';
    } else {
      phoneEl.style.backgroundSize = 'cover';
      phoneEl.style.backgroundPosition = 'center center';
    }
  }

  let raf = null;
  let objects = [];
  let objectPool = []; 
  let score = 0, supplyCount = 0, combo = 0;
  let feverCount = 0;
  let lives = 3;
  let difficultyLevel = 1;
  
  let player = { x: WORLD_W / 2, y: 688, w: 92, h: 114, targetX: WORLD_W / 2, vx: 0, dir: 1 };
  let playerVisualState = 'idle';
  let isHitVisual = false;
  let hitVisualTimer = null;
  let lastPositionDirection = 'RIGHT';
  let keyLeft=false, keyRight=false;
  let isStarted=false, isGameOver=false, isFever=false;
  let gameStartTime=0, lastTime=0, lastSpawnTime=0;
  let feverEndTime=0, nextFeverAllowedTime=0;
  let lastGoldSpawnTime=0;

  function difficulty(now) {
    const t = (now - gameStartTime) / 1000;
    const lv = Math.max(1, Math.min(10, difficultyLevel));
    const visibleStep = lv - 1;
    const effectiveStep = visibleStep + 4;
    return {
      elapsed: t,
      level: lv,
      baseSpeed: 125 + effectiveStep * 18 + Math.min(t * 1.1, 28),
      spawnInterval: Math.max(260, 860 - effectiveStep * 58 - Math.min(t * 1.7, 70)),
      mouseRatio: Math.min(0.68, 0.13 + effectiveStep * 0.045)
    };
  }

  function resetGame() {
    if (raf) cancelAnimationFrame(raf);
    objectPool.forEach(p => { p.inUse = false; p.el.style.display = 'none'; });
    objects = [];
    score=0; supplyCount=0; combo=0; feverCount=0; lives=3;
    difficultyLevel=1;
    keyLeft=false; keyRight=false;
    playerVisualState='';
    isHitVisual=false;
    clearTimeout(hitVisualTimer);
    isStarted=true; isGameOver=false; isFever=false;
    gameStartTime=performance.now(); lastTime=gameStartTime; lastSpawnTime=gameStartTime;
    feverEndTime=0; nextFeverAllowedTime=gameStartTime + 9000; lastGoldSpawnTime=0;
    const centerX = WORLD_W / 2;
    const maxPositionOffset = Math.min(centerX - 45, (WORLD_W - 45) - centerX);
    const startSide = Math.random() < 0.5 ? -1 : 1;
    const startX = centerX + startSide * maxPositionOffset * 0.2;
    player.x=startX; player.targetX=startX; player.dir=startSide;
    lastPositionDirection = startSide < 0 ? 'LEFT' : 'RIGHT';
    updateCamera();
    updateHud();
    feverBadge.classList.remove('on'); feverFlash.classList.remove('on');
    $('gameScreen').classList.remove('resultMode');
    playerEl.style.display = '';
    playerImg.style.display = '';
    playerEl.classList.remove('hit');
    setPlayerVisual('idle', true);
    positionPlayer();
    setGameBackgroundMode(false);
  }

  function startGame() { resetGame(); show('gameScreen'); setGameBackgroundMode(true); raf=requestAnimationFrame(loop); }

  function updateHud() {
    updatePositionHud();
    boxCountText.textContent = Math.min(supplyCount, 9999);
    if (lifeCountText) lifeCountText.textContent = lives;
    if (levelBadge) levelBadge.textContent = 'LV.' + difficultyLevel;
  }

  function updatePositionHud() {
    const centerX = WORLD_W / 2;
    const maxOffset = Math.min(centerX - 45, (WORLD_W - 45) - centerX);
    const delta = player.x - centerX;
    if (Math.abs(delta) > 0.8) lastPositionDirection = delta < 0 ? 'LEFT' : 'RIGHT';
    if (!positionDirText || !positionPercentText) return;
    const percent = clamp(Math.round(Math.abs(delta) / maxOffset * 100), 0, 100);
    positionDirText.textContent = lastPositionDirection;
    positionPercentText.textContent = percent;
  }

  function startFever(now) {
    if (isFever || now < nextFeverAllowedTime) return;
    isFever = true;
    feverCount += 1;
    feverEndTime = now + 5000;
    
    // 피버 진입음은 재생하지 않음. 치킨 아이템 획득음만 사용합니다.

    objects.filter(o=>o.type==='mouse').forEach(o=>{ o.dead=true; o.el.style.display = 'none'; const p = objectPool.find(x=>x.el===o.el); if(p)p.inUse=false; });
    objects = objects.filter(o=>!o.dead);

    isFeverNoticeActive = true;
    comboCenter.classList.remove('show');
    clearTimeout(comboTimer);
    clearTimeout(feverNoticeTimer);
    feverNoticeTimer = setTimeout(()=>{ isFeverNoticeActive = false; }, 1050);

    feverBadge.classList.add('on'); feverFlash.classList.remove('on');
  }

  function endFever(now) {
    isFever = false;
    difficultyLevel = Math.min(10, difficultyLevel + 1);
    if (levelBadge) {
      levelBadge.textContent = 'LV.' + difficultyLevel;
      levelBadge.classList.remove('up');
      void levelBadge.offsetWidth;
      levelBadge.classList.add('up');
    }
    nextFeverAllowedTime = now + 8000;
    feverBadge.classList.remove('on'); feverFlash.classList.remove('on');
    isFeverNoticeActive = false;
    clearTimeout(feverNoticeTimer);
    const feverCollectedObjects = objects.filter(o=>o.type==='box' || o.type==='gold');
    
    // 피버 종료에 따른 잔여 상자 자동 자석 흡수 오디오 ("뿅뿅뿅뿅뿅!")
    if (feverCollectedObjects.length > 0) {
      playVacuumChainSfx(feverCollectedObjects.length);
    }

    feverCollectedObjects.forEach(o=>{
      spawnFeverAutoPickupEffect(o.x + o.w/2, o.y + o.h/2);
      supplyCount += 1;
      o.dead=true;
      o.el.style.display = 'none';
      const p = objectPool.find(x=>x.el===o.el); if(p)p.inUse=false;
    });
    if (feverCollectedObjects.length > 0) {
      combo += feverCollectedObjects.length;
      if (combo >= 3) showCombo(combo);
    }
    updateHud();
    objects = objects.filter(o=>!o.dead);
    lastSpawnTime = now + 220;
  }

  function getPooledObject(type) {
    let poolItem = objectPool.find(o => o.type === type && o.inUse === false);
    if (!poolItem) {
      const el = document.createElement('div');
      el.className = 'object ' + type;
      const img = document.createElement('img');
      img.src = type==='box'?ASSETS.box:type==='gold'?ASSETS.gold:ASSETS.mouse;
      el.appendChild(img);
      playArea.appendChild(el);
      poolItem = { type, el, inUse: true };
      objectPool.push(poolItem);
    } else {
      poolItem.inUse = true;
    }
    poolItem.el.style.opacity = '1';
    poolItem.el.style.display = 'block'; 
    return poolItem.el;
  }

  function spawnObject(now) {
    const d = difficulty(now);
    if (objects.length > (isFever ? 13 : 10)) return;
    let type;
    if (isFever) {
      type = 'box';
    } else {
      const canGold = now > nextFeverAllowedTime && d.elapsed > 9 && now - lastGoldSpawnTime > 6500;
      if (canGold && Math.random() < 0.12) { type='gold'; lastGoldSpawnTime=now; }
      else type = Math.random() < d.mouseRatio ? 'mouse' : 'box';
    }
    
    const el = getPooledObject(type);
    const w = type==='mouse'?48:42, h = type==='mouse'?42:type==='gold'?50:52;
    const margin=24;
    
    const spawnMin = clamp(cameraX + margin, margin, WORLD_W - margin - w);
    const spawnMax = clamp(cameraX + SCREEN_W - margin - w, spawnMin, WORLD_W - margin - w);
    const x = spawnMin + Math.random() * Math.max(1, spawnMax - spawnMin);
    
    let speed;
    if (isFever) {
      speed = d.baseSpeed * 1.65 + Math.random() * 65;
    } else if (type === 'mouse') {
      speed = d.baseSpeed * (0.85 + Math.random() * 0.70);
    } else {
      speed = d.baseSpeed + Math.random() * 45;
    }
    
    const obj = { 
      type, 
      el, 
      x, 
      y:-70, 
      w, 
      h, 
      speed, 
      dead:false
    };

    // 보급품 낙하 틸트 무작위 고정 각도 부여 (바람을 헤치는 흔들림 보장)
    if (type === 'box') {
      const direction = Math.random() < 0.5 ? -1 : 1;
      obj.fixedAngle = direction * (1.8 + Math.random() * 1.2);
    }

    objects.push(obj);
    el.style.left = '0px'; el.style.top = '0px';
    el.style.transform = `translate3d(${x - cameraX}px, -70px, 0)`;
  }

  function loop(now) {
    if (!isStarted || isGameOver) return;
    const dt = Math.min(32, now-lastTime)/1000; lastTime = now;
    const d = difficulty(now);
    if (isFever && now >= feverEndTime) endFever(now);
    const interval = isFever ? 210 : d.spawnInterval;
    if (now - lastSpawnTime > interval) { spawnObject(now); lastSpawnTime=now; }
    updatePlayer(now, dt);
    updateObjects(now, dt);
    updateHud();
    raf=requestAnimationFrame(loop);
  }

  function setPlayerVisual(state, force=false) {
    if (isHitVisual && !force) return;
    const nextSrc = state === 'run' ? PLAYER_RUN_SRC : PLAYER_IDLE_SRC;
    if (!force && playerVisualState === state) return;
    playerVisualState = state;
    playerImg.src = nextSrc;
  }

  function showPlayerHitVisual() {
    isHitVisual = true;
    clearTimeout(hitVisualTimer);
    playerImg.src = PLAYER_HIT_SRC;

    hitVisualTimer = setTimeout(() => {
      isHitVisual = false;
      setPlayerVisual(playerVisualState || 'idle', true);
    }, 450);
  }

  function updatePlayer(now, dt) {
    const speed = isFever ? 660 : 500;
    if (keyLeft) { player.targetX -= speed*dt; player.dir=-1; }
    if (keyRight) { player.targetX += speed*dt; player.dir=1; }
    player.targetX = clamp(player.targetX, 46, WORLD_W - 46);
    const prevX = player.x;
    const follow = isFever ? 0.32 : 0.24;
    player.x += (player.targetX - player.x) * follow;
    const dx = player.x - prevX;
    if (Math.abs(dx) > 0.35) player.dir = dx > 0 ? 1 : -1;
    const isMovingNow = keyLeft || keyRight || Math.abs(player.targetX - player.x) > 1.2 || Math.abs(dx) > 0.35;
    setPlayerVisual(isMovingNow ? 'run' : 'idle');
    updateCamera();
    positionPlayer();
  }

  function positionSkyClouds() {
    skyCloudEls.forEach((el) => {
      const x = Number(el.dataset.x || 0);
      const y = Number(el.dataset.y || 0);
      const parallax = Number(el.dataset.parallax || 0.25);
      el.style.transform = `translate3d(${x - cameraX * parallax}px, ${y}px, 0)`;
    });
  }

  function positionPlayer() {
    const flip = player.dir < 0 ? 1 : -1;
    const feverScale = isFever ? 2 : 1;
    const screenX = player.x - cameraX;
    
    playerEl.style.transform = `translate3d(${screenX - player.w/2}px, 0px, 0) scaleX(${flip}) scale(${feverScale})`;
    
    const mountainBgEl = $('mountainBg');
    if (mountainBgEl) { mountainBgEl.style.backgroundPositionX = (-cameraX) + 'px'; }
    
    const groundEl = $('ground');
    if (groundEl) { groundEl.style.backgroundPositionX = (-cameraX) + 'px'; }

    positionSkyClouds();

    if (isStarted && !isGameOver) {
      phoneEl.style.backgroundSize = WORLD_W + 'px ' + SCREEN_H + 'px';
      phoneEl.style.backgroundPosition = (-cameraX) + 'px center';
    }
  }

  function releaseObject(o) {
    o.dead = true;
    o.el.style.opacity = '1';
    o.el.style.display = 'none';
    const poolItem = objectPool.find(p => p.el === o.el);
    if (poolItem) poolItem.inUse = false;
  }

  function loseLife() {
    lives = Math.max(0, lives - 1);
    updateHud();
    playHitSfx();
    showPlayerHitVisual();
    playerEl.classList.remove('hit');
    void playerEl.offsetWidth;
    playerEl.classList.add('hit');
    if (lives <= 0) {
      endGame();
      return true;
    }
    return false;
  }

  function updateObjects(now, dt) {
    const pr = getPlayerHitbox();
    for (const o of objects) {
      o.y += o.speed*dt;
      
      let transformStr = `translate3d(${o.x - cameraX}px, ${o.y}px, 0)`;
      if (o.type === 'box' && o.fixedAngle) {
        transformStr += ` rotate(${o.fixedAngle}deg)`;
      }
      o.el.style.transform = transformStr;

      if (o.y >= SCREEN_H - 100) {
        if (o.type==='box' || o.type==='gold') combo = 0;
        releaseObject(o);
        continue;
      }

      if (o.y < 50) continue;

      const or = getObjectHitbox(o);

      if (hit(pr,or)) {
        if (o.type==='box') collect(o, 10, now);
        else if (o.type==='gold') { collect(o, 20, now); startFever(now); }
        else if (o.type==='mouse') { releaseObject(o); if (loseLife()) return; }
      }
    }
    objects = objects.filter(o=>!o.dead);
  }

  function getPlayerHitbox() {
    const scale = isFever ? 2 : 1;
    const scaledW = player.w * scale;
    const scaledH = player.h * scale;
    const visualY = SCREEN_H - 42 - scaledH;

    return { x: player.x - scaledW / 2, y: visualY, w: scaledW, h: scaledH };
  }

  function getObjectHitbox(o) {
    if (o.type === 'gold') {
      return { x: o.x, y: o.y, w: 31, h: 53 };
    }
    if (o.type === 'mouse') {
      return { x: o.x, y: o.y, w: 45, h: 63 };
    }
    return { x: o.x, y: o.y, w: o.w, h: o.h };
  }
  
  function hit(a,b) { return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y; }

  function collect(o, pts, now) {
    const fxX = o.x + o.w/2;
    const fxY = o.y + o.h/2;
    spawnPickupEffect(fxX, fxY, o.type); 
    releaseObject(o);
    score += pts;
    if (o.type === 'box' || o.type === 'gold') {
      supplyCount += 1;
      combo += 1;
      if (combo >= 3) showCombo(combo);

      // 효과음 기획안 반영
      if (o.type === 'box') {
        playBoxSfx(combo);
      } else if (o.type === 'gold') {
        playGoldSfx();
      }
    }
  }

  let comboTimer=null, feverNoticeTimer=null;
  let isFeverNoticeActive=false;
  function showCombo(n) {
    if (isFeverNoticeActive) {
      comboCenter.classList.remove('show');
      clearTimeout(comboTimer);
      return;
    }
    comboNum.textContent = n;
    comboCenter.classList.remove('show'); void comboCenter.offsetWidth; comboCenter.classList.add('show');
    clearTimeout(comboTimer); comboTimer=setTimeout(()=>comboCenter.classList.remove('show'),720);
  }

  function spawnFeverAutoPickupEffect(x, y) {
    const screenX = x - cameraX;

    const fx = document.createElement('div');
    fx.className = 'feverAutoPickupEffect';
    fx.style.left = screenX + 'px';
    fx.style.top = y + 'px';
    const img = document.createElement('img');
    img.src = ASSETS.effect;
    fx.appendChild(img);
    playArea.appendChild(fx);
    setTimeout(()=>fx.remove(), 1050);
  }

  function spawnSparklingParticles(x, y, isGold) {
    const screenX = x - cameraX;
    const particleCount = isGold ? 15 : 10; 
    
    const colors = isGold 
      ? ['#FFD54F', '#FF8F00', '#FFEA00', '#FFFFFF']
      : ['#FFE872', '#FFD54F', '#FFF9C4', '#FFFFFF'];
    
    for (let i = 0; i < particleCount; i++) {
      const p = document.createElement('div');
      p.style.position = 'absolute';
      p.style.left = screenX + 'px';
      p.style.top = y + 'px';
      p.style.width = (4 + Math.random() * 5) + 'px';
      p.style.height = p.style.width;
      p.style.pointerEvents = 'none';
      p.style.zIndex = '59';
      
      const isStar = Math.random() < 0.45;
      if (isStar) {
        p.innerHTML = '✦';
        p.style.color = colors[Math.floor(Math.random() * colors.length)];
        p.style.fontSize = (10 + Math.random() * 10) + 'px';
        p.style.lineHeight = '1';
        p.style.display = 'flex';
        p.style.alignItems = 'center';
        p.style.justifyContent = 'center';
        p.style.fontFamily = 'Tomorrow, sans-serif';
      } else {
        p.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
        p.style.borderRadius = '50%';
      }
      
      playArea.appendChild(p);
      
      let vx = (Math.random() - 0.5) * 1.5; 
      let vy = -1.2 - Math.random() * 1.8;
      let px = 0;
      let py = 0;
      let buoyancy = -0.15;
      let opacity = 1.0;
      let scale = 1.0;
      
      const startTime = performance.now();
      const lifetime = 350 + Math.random() * 100;
      
      function updateParticle(timestamp) {
        const elapsed = timestamp - startTime;
        if (elapsed >= lifetime || !isStarted) {
          p.remove();
          return;
        }
        
        const t = elapsed / lifetime;
        opacity = 1.0 - t;
        scale = 1.0 - t * 0.6;
        
        px += vx;
        vy += buoyancy;
        py += vy;
        
        p.style.transform = `translate3d(${px}px, ${py}px, 0) scale(${scale})`;
        p.style.opacity = opacity;
        
        requestAnimationFrame(updateParticle);
      }
      requestAnimationFrame(updateParticle);
    }
  }

  function spawnPickupEffect(x, y, type) {
    const screenX = x - cameraX;

    const fx = document.createElement('div');
    fx.className = 'pickupEffect';
    fx.style.left = screenX + 'px';
    fx.style.top = y + 'px';
    const img = document.createElement('img');
    img.src = ASSETS.effect;
    fx.appendChild(img);
    playArea.appendChild(fx);
    setTimeout(()=>fx.remove(), 560);

    const isGold = (type === 'gold');
    spawnSparklingParticles(x, y, isGold);
  }

  function endGame(reason = 'gameover') {
    if (reason === 'gameover') playGameOverSfx();
    isGameOver=true; isStarted=false; if (raf) cancelAnimationFrame(raf);
    setGameBackgroundMode(false);
    objects.forEach(releaseObject); objects=[];
    $('finalSupplyCount').textContent = supplyCount;
    const finalComboCount = $('finalComboCount');
    const finalFeverCount = $('finalFeverCount');
    if (finalComboCount) finalComboCount.textContent = combo + '개';
    if (finalFeverCount) finalFeverCount.textContent = feverCount + '회';
    clearTimeout(hitVisualTimer);
    isHitVisual = false;
    playerEl.classList.remove('hit');
    playerEl.style.display = 'none';
    playerImg.style.display = 'none';
    $('gameScreen').classList.add('resultMode');
    $('result').classList.add('active');
  }

  window.addEventListener('keydown', e=>{
    if (e.key==='ArrowLeft'||e.key==='a'||e.key==='A') { keyLeft=true; e.preventDefault(); }
    if (e.key==='ArrowRight'||e.key==='d'||e.key==='D') { keyRight=true; e.preventDefault(); }
  });
  window.addEventListener('keyup', e=>{
    if (e.key==='ArrowLeft'||e.key==='a'||e.key==='A') keyLeft=false;
    if (e.key==='ArrowRight'||e.key==='d'||e.key==='D') keyRight=false;
  });

  function setTouchMoveByClientX(clientX) {
    if (!isStarted || isGameOver) return;
    const rect = phoneEl.getBoundingClientRect();
    const midX = rect.left + rect.width / 2;
    if (clientX < midX) { keyLeft = true; keyRight = false; } else { keyLeft = false; keyRight = true; }
  }

  function stopTouchMove() { keyLeft = false; keyRight = false; }

  playArea.addEventListener('pointerdown', e=>{ 
    e.preventDefault(); 
    ensureAudio(); // 터치 상호작용 시마다 Web Audio 복구 및 활성화
    if (!isStarted || isGameOver) return; 
    setTouchMoveByClientX(e.clientX); 
  });
  playArea.addEventListener('pointermove', e=>{ e.preventDefault(); if (!isStarted || isGameOver) return; if (e.buttons > 0) { setTouchMoveByClientX(e.clientX); } });
  playArea.addEventListener('pointerup', e=>{ e.preventDefault(); stopTouchMove(); });
  playArea.addEventListener('pointercancel', e=>{ e.preventDefault(); stopTouchMove(); });

  function bindTap(el, handler) {
    if (!el) return;
    let handledAt = 0;
    const run = (e) => {
      if (e) {
        e.preventDefault();
        e.stopPropagation();
      }
      handledAt = Date.now();
      handler();
    };
    el.addEventListener('pointerup', run, { passive: false });
    el.addEventListener('click', (e) => {
      if (Date.now() - handledAt < 500) {
        e.preventDefault();
        e.stopPropagation();
        return;
      }
      run(e);
    }, { passive: false });
  }

  // 모바일에서는 전역 touch preventDefault 때문에 onclick이 막힐 수 있어 pointerup/click을 함께 바인딩합니다.
  bindTap($('lobbyStartBtn'), () => {
    ensureAudio(); // 버튼 최초 터치 오디오 활성화
    playGameStartSfx();
    show('gameScreen');
    startGame();
  });

  bindTap($('retryBtn'), () => { playGameStartSfx(); startGame(); });
  bindTap($('mainBtn'), () => { playButtonSfx(); show('lobbyScreen'); });
  bindTap($('quitBtn'), () => { playButtonSfx(); endGame('quit'); });
  bindTap($('completeBtn'), () => { playButtonSfx(); show('complete'); });
  bindTap($('againBtn'), () => { playGameStartSfx(); startGame(); });

  updatePhoneScale();
  // 첫 화면으로 대기실 로비 스크린을 노출합니다.
  show('lobbyScreen');
})();
</script>
</body>
</html>
