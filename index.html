    /* 미디어쿼리 대응 모바일 패딩 조정 오프셋 */
    .lobbyNav { top: var(--mobile-ui-offset, 0px); }
    .lobbyHeader { margin-top: calc(var(--mobile-ui-offset, 0px) + 108px); }
  }
</style>
</head>

<script>
(() => {
  document.addEventListener('contextmenu', e => e.preventDefault());
  document.addEventListener('dragstart', e => e.preventDefault());
  document.addEventListener('selectstart', e => e.preventDefault());
  document.addEventListener('gesturestart', e => e.preventDefault());
  document.addEventListener('gesturechange', e => e.preventDefault());

  // ★ [V80 안전 라우팅] 인게임 리소스 경로 일괄 game 폴더 사양으로 변환 완료
  const ASSETS = { 
    chunsik: 'assets/game/player_character.png', 
    box: 'assets/game/item_supply_drop.png', 
    gold: 'assets/game/item_fever.png', 
    mouse: 'assets/game/obstacle_hazard.png', 
    effect: 'assets/game/fx_pickup.png' 
  };
  
  const $ = (id) => document.getElementById(id);
  // 스크린 배열에 lobbyScreen 및 eventScreen 신규 등록 연동
  const screens = ['lobbyScreen', 'eventScreen', 'gameScreen', 'result', 'save', 'complete'].map($);
  const show = (id) => { screens.forEach(s=> { if(s) s.classList.remove('active'); }); if($(id)) $(id).classList.add('active'); };

  const playArea = $('playArea');
  const playerEl = $('player');
  const playerImg = playerEl.querySelector('img');
  
  // ★ [V80 안전 라우팅] 변수 내부 하드코딩 경로 일치 수술 완료
  const PLAYER_RUN_SRC = 'assets/game/player_run.webp';
  const PLAYER_IDLE_SRC = 'assets/game/player_idle.png';
  const PLAYER_HIT_SRC = 'assets/game/player_hit.png';
  
  const positionDirText = $('positionDir');
  const positionPercentText = $('positionPercent');
  const boxCountText = $('boxCountText');
  const lifeCountText = $('lifeCountText');
  const comboCenter = $('comboCenter');
  const comboNum = $('comboNum');
  const feverBadge = $('feverBadge');
  const feverFlash = $('feverFlash');
  const levelBadge = $('levelBadge');
  const phoneEl = $('phone');
  const skyCloudEls = Array.from(document.querySelectorAll('.skyCloud'));

  const SCREEN_W = 393;
  const SCREEN_H = 844;
  const WORLD_W = Math.round(SCREEN_W * 3.0);
  const CAMERA_MAX_X = WORLD_W - SCREEN_W;
  let cameraX = CAMERA_MAX_X / 2;

  function updatePhoneScale() {
    if (!phoneEl) return;
    const isMobile = window.matchMedia('(max-width: 600px)').matches;
    if (!isMobile) {
      phoneEl.style.transform = '';
      phoneEl.style.removeProperty('--mobile-ui-offset');
      return;
    }
    const viewportW = window.innerWidth || document.documentElement.clientWidth || SCREEN_W;
    const viewportH = window.innerHeight || document.documentElement.clientHeight || SCREEN_H;
    const scale = viewportW / SCREEN_W;
    const shiftY = 30;
    const phoneTop = viewportH - (SCREEN_H * scale) + shiftY;
    const mobileUiOffset = Math.max(0, Math.ceil(-phoneTop / scale));
    phoneEl.style.setProperty('--mobile-ui-offset', mobileUiOffset + 'px');
    phoneEl.style.transform = `translateY(${shiftY}px) scale(${scale})`;
  }

  window.addEventListener('resize', updatePhoneScale);
  window.addEventListener('orientationchange', () => setTimeout(updatePhoneScale, 120));

  function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

  function updateCamera() {
    cameraX = clamp(player.x - SCREEN_W / 2, 0, CAMERA_MAX_X);
  }

  function setGameBackgroundMode(isExtended) {
    if (!phoneEl) return;
    if (isExtended) {
      phoneEl.style.backgroundSize = WORLD_W + 'px ' + SCREEN_H + 'px';
      phoneEl.style.backgroundPosition = (-cameraX) + 'px center';
    } else {
      phoneEl.style.backgroundSize = 'cover';
      phoneEl.style.backgroundPosition = 'center center';
    }
  }

  let raf = null;
  let objects = [];
  let objectPool = []; 
  let score = 0, supplyCount = 0, combo = 0;
  let feverCount = 0;
  let lives = 3;
  let difficultyLevel = 1;
  
  let player = { x: WORLD_W / 2, y: 688, w: 92, h: 114, targetX: WORLD_W / 2, vx: 0, dir: 1 };
  let playerVisualState = 'idle';
  let isHitVisual = false;
  let hitVisualTimer = null;
  let lastPositionDirection = 'RIGHT';
  let keyLeft=false, keyRight=false;
  let isStarted=false, isGameOver=false, isFever=false;
  let gameStartTime=0, lastTime=0, lastSpawnTime=0;
  let feverEndTime=0, nextFeverAllowedTime=0;
  let lastGoldSpawnTime=0;

  let audioCtx=null, masterGain=null, musicTimer=null, isAudioReady=false;
  const bgmNotes = [261.63, 329.63, 392.00, 493.88, 440.00, 392.00, 329.63, 293.66];
  let bgmStep = 0;

  function difficulty(now) {
    const t = (now - gameStartTime) / 1000;
    const lv = Math.max(1, Math.min(10, difficultyLevel));
    const visibleStep = lv - 1;
    const effectiveStep = visibleStep + 4;
    return {
      elapsed: t,
      level: lv,
      baseSpeed: 125 + effectiveStep * 18 + Math.min(t * 1.1, 28),
      spawnInterval: Math.max(260, 860 - effectiveStep * 58 - Math.min(t * 1.7, 70)),
      mouseRatio: Math.min(0.68, 0.13 + effectiveStep * 0.045)
    };
  }

  function resetGame() {
    if (raf) cancelAnimationFrame(raf);
    objectPool.forEach(p => { p.inUse = false; p.el.style.display = 'none'; });
    objects = [];
    score=0; supplyCount=0; combo=0; feverCount=0; lives=3;
    difficultyLevel=1;
    keyLeft=false; keyRight=false;
    playerVisualState='';
    isHitVisual=false;
    clearTimeout(hitVisualTimer);
    isStarted=true; isGameOver=false; isFever=false;
    gameStartTime=performance.now(); lastTime=gameStartTime; lastSpawnTime=gameStartTime;
    feverEndTime=0; nextFeverAllowedTime=gameStartTime + 9000; lastGoldSpawnTime=0;
    const centerX = WORLD_W / 2;
    const maxPositionOffset = Math.min(centerX - 45, (WORLD_W - 45) - centerX);
    const startSide = Math.random() < 0.5 ? -1 : 1;
    const startX = centerX + startSide * maxPositionOffset * 0.2;
    player.x=startX; player.targetX=startX; player.dir=startSide;
    lastPositionDirection = startSide < 0 ? 'LEFT' : 'RIGHT';
    updateCamera();
    updateHud();
    feverBadge.classList.remove('on'); feverFlash.classList.remove('on');
    $('gameScreen').classList.remove('resultMode');
    playerEl.style.display = '';
    playerImg.style.display = '';
    playerEl.classList.remove('hit');
    setPlayerVisual('idle', true);
    positionPlayer();
    setGameBackgroundMode(false);
  }

  function startGame() { resetGame(); show('gameScreen'); setGameBackgroundMode(true); startBgm(); raf=requestAnimationFrame(loop); }

  function updateHud() {
    updatePositionHud();
    boxCountText.textContent = Math.min(supplyCount, 9999);
    if (lifeCountText) lifeCountText.textContent = lives;
    if (levelBadge) levelBadge.textContent = 'LV.' + difficultyLevel;
  }

  function updatePositionHud() {
    const centerX = WORLD_W / 2;
    const maxOffset = Math.min(centerX - 45, (WORLD_W - 45) - centerX);
    const delta = player.x - centerX;
    if (Math.abs(delta) > 0.8) lastPositionDirection = delta < 0 ? 'LEFT' : 'RIGHT';
    if (!positionDirText || !positionPercentText) return;
    const percent = clamp(Math.round(Math.abs(delta) / maxOffset * 100), 0, 100);
    positionDirText.textContent = lastPositionDirection;
    positionPercentText.textContent = percent;
  }

  function startFever(now) {
    if (isFever || now < nextFeverAllowedTime) return;
    isFever = true;
    feverCount += 1;
    feverEndTime = now + 5000;
    objects.filter(o=>o.type==='mouse').forEach(o=>{ o.dead=true; o.el.style.display = 'none'; const p = objectPool.find(x=>x.el===o.el); if(p)p.inUse=false; });
    objects = objects.filter(o=>!o.dead);

    isFeverNoticeActive = true;
    comboCenter.classList.remove('show');
    clearTimeout(comboTimer);
    clearTimeout(feverNoticeTimer);
    feverNoticeTimer = setTimeout(()=>{ isFeverNoticeActive = false; }, 1050);

    feverBadge.classList.add('on'); feverFlash.classList.add('on');
    setBgmFever(true);
    playFeverSfx();
  }

  function endFever(now) {
    isFever = false;
    difficultyLevel = Math.min(10, difficultyLevel + 1);
    if (levelBadge) {
      levelBadge.textContent = 'LV.' + difficultyLevel;
      levelBadge.classList.remove('up');
      void levelBadge.offsetWidth;
      levelBadge.classList.add('up');
    }
    nextFeverAllowedTime = now + 8000;
    feverBadge.classList.remove('on'); 
    
    feverFlash.classList.remove('on');
    
    isFeverNoticeActive = false;
    clearTimeout(feverNoticeTimer);
    setBgmFever(false);
    const feverCollectedObjects = objects.filter(o=>o.type==='box' || o.type==='gold');
    feverCollectedObjects.forEach(o=>{
      spawnFeverAutoPickupEffect(o.x + o.w/2, o.y + o.h/2);
      supplyCount += 1;
      o.dead=true;
      o.el.style.display = 'none';
      const p = objectPool.find(x=>x.el===o.el); if(p)p.inUse=false;
    });
    if (feverCollectedObjects.length > 0) {
      combo += feverCollectedObjects.length;
      if (combo >= 3) showCombo(combo);
    }
    updateHud();
    objects = objects.filter(o=>!o.dead);
    lastSpawnTime = now + 220;
  }

  function getPooledObject(type) {
    let poolItem = objectPool.find(o => o.type === type && o.inUse === false);
    if (!poolItem) {
      const el = document.createElement('div');
      el.className = 'object ' + type;
      const img = document.createElement('img');
      img.src = type==='box'?ASSETS.box:type==='gold'?ASSETS.gold:ASSETS.mouse;
      el.appendChild(img);
      playArea.appendChild(el);
      poolItem = { type, el, inUse: true };
      objectPool.push(poolItem);
    } else {
      poolItem.inUse = true;
    }
    poolItem.el.style.opacity = '1';
    poolItem.el.style.display = 'block'; 
    return poolItem.el;
  }

  function spawnObject(now) {
    const d = difficulty(now);
    if (objects.length > (isFever ? 13 : 10)) return;
    let type;
    if (isFever) {
      type = 'box';
    } else {
      const canGold = now > nextFeverAllowedTime && d.elapsed > 9 && now - lastGoldSpawnTime > 6500;
      if (canGold && Math.random() < 0.12) { type='gold'; lastGoldSpawnTime=now; }
      else type = Math.random() < d.mouseRatio ? 'mouse' : 'box';
    }
    
    const el = getPooledObject(type);
    const w = type==='mouse'?48:42, h = type==='mouse'?42:type==='gold'?50:52;
    const margin=24;
    
    const spawnMin = clamp(cameraX + margin, margin, WORLD_W - margin - w);
    const spawnMax = clamp(cameraX + SCREEN_W - margin - w, spawnMin, WORLD_W - margin - w);
    const x = spawnMin + Math.random() * Math.max(1, spawnMax - spawnMin);
    
    let speed;
    if (isFever) {
      speed = d.baseSpeed * 1.65 + Math.random() * 65;
    } else if (type === 'mouse') {
      speed = d.baseSpeed * (0.85 + Math.random() * 0.70);
    } else {
      speed = d.baseSpeed + Math.random() * 45;
    }
    
    const obj = { 
      type, 
      el, 
      x, 
      y:-70, 
      w, 
      h, 
      speed, 
      dead:false
    };

    if (type === 'box') {
      const direction = Math.random() < 0.5 ? -1 : 1;
      obj.fixedAngle = direction * (1.8 + Math.random() * 1.2); 
    }

    objects.push(obj);
    el.style.left = '0px'; el.style.top = '0px';
    el.style.transform = `translate3d(${x - cameraX}px, -70px, 0)`;
  }

  function loop(now) {
    if (!isStarted || isGameOver) return;
    const dt = Math.min(32, now-lastTime)/1000; lastTime = now;
    const d = difficulty(now);
    if (isFever && now >= feverEndTime) endFever(now);
    const interval = isFever ? 210 : d.spawnInterval;
    if (now - lastSpawnTime > interval) { spawnObject(now); lastSpawnTime=now; }
    updatePlayer(now, dt);
    updateObjects(now, dt);
    updateHud();
    raf=requestAnimationFrame(loop);
  }

  function setPlayerVisual(state, force=false) {
    if (isHitVisual && !force) return;
    const nextSrc = state === 'run' ? PLAYER_RUN_SRC : PLAYER_IDLE_SRC;
    if (!force && playerVisualState === state) return;
    playerVisualState = state;
    playerImg.src = nextSrc;
  }

  function showPlayerHitVisual() {
    isHitVisual = true;
    clearTimeout(hitVisualTimer);
    playerImg.src = PLAYER_HIT_SRC;

    hitVisualTimer = setTimeout(() => {
      isHitVisual = false;
      setPlayerVisual(playerVisualState || 'idle', true);
    }, 450);
  }

  function updatePlayer(now, dt) {
    const speed = isFever ? 660 : 500;
    if (keyLeft) { player.targetX -= speed*dt; player.dir=-1; }
    if (keyRight) { player.targetX += speed*dt; player.dir=1; }
    player.targetX = clamp(player.targetX, 46, WORLD_W - 46);
    const prevX = player.x;
    const follow = isFever ? 0.32 : 0.24;
    player.x += (player.targetX - player.x) * follow;
    const dx = player.x - prevX;
    if (Math.abs(dx) > 0.35) player.dir = dx > 0 ? 1 : -1;
    const isMovingNow = keyLeft || keyRight || Math.abs(player.targetX - player.x) > 1.2 || Math.abs(dx) > 0.35;
    setPlayerVisual(isMovingNow ? 'run' : 'idle');
    updateCamera();
    positionPlayer();
  }

  function positionSkyClouds() {
    skyCloudEls.forEach((el) => {
      const x = Number(el.dataset.x || 0);
      const y = Number(el.dataset.y || 0);
      const parallax = Number(el.dataset.parallax || 0.25);
      el.style.transform = `translate3d(${x - cameraX * parallax}px, ${y}px, 0)`;
    });
  }

  function positionPlayer() {
    const flip = player.dir < 0 ? 1 : -1;
    const feverScale = isFever ? 2 : 1;
    const screenX = player.x - cameraX;
    
    playerEl.style.transform = `translate3d(${screenX - player.w/2}px, 0px, 0) scaleX(${flip}) scale(${feverScale})`;
    
    const mountainBgEl = $('mountainBg');
    if (mountainBgEl) { mountainBgEl.style.backgroundPositionX = (-cameraX) + 'px'; }
    
    const groundEl = $('ground');
    if (groundEl) { groundEl.style.backgroundPositionX = (-cameraX) + 'px'; }

    positionSkyClouds();

    if (isStarted && !isGameOver) {
      phoneEl.style.backgroundSize = WORLD_W + 'px ' + SCREEN_H + 'px';
      phoneEl.style.backgroundPosition = (-cameraX) + 'px center';
    }
  }

  function releaseObject(o) {
    o.dead = true;
    o.el.style.opacity = '1';
    o.el.style.display = 'none';
    const poolItem = objectPool.find(p => p.el === o.el);
    if (poolItem) poolItem.inUse = false;
  }

  function loseLife() {
    lives = Math.max(0, lives - 1);
    updateHud();
    showPlayerHitVisual();
    playerEl.classList.remove('hit');
    void playerEl.offsetWidth;
    playerEl.classList.add('hit');
    if (lives <= 0) {
      endGame();
      return true;
    }
    return false;
  }

  function updateObjects(now, dt) {
    const pr = getPlayerHitbox();
    for (const o of objects) {
      o.y += o.speed*dt;
      
      let transformStr = `translate3d(${o.x - cameraX}px, ${o.y}px, 0)`;
      if (o.type === 'box' && o.fixedAngle) {
        transformStr += ` rotate(${o.fixedAngle}deg)`;
      }
      o.el.style.transform = transformStr;

      if (o.y >= SCREEN_H - 100) {
        if (o.type==='box' || o.type==='gold') combo = 0;
        releaseObject(o);
        continue;
      }

      if (o.y < 50) continue;

      const or = getObjectHitbox(o);

      if (hit(pr,or)) {
        if (o.type==='box') collect(o, 10, now);
        else if (o.type==='gold') { collect(o, 20, now); startFever(now); }
        else if (o.type==='mouse') { releaseObject(o); if (loseLife()) return; }
      }
    }
    objects = objects.filter(o=>!o.dead);
  }

  function getPlayerHitbox() {
    const scale = isFever ? 2 : 1;
    const scaledW = player.w * scale;
    const scaledH = player.h * scale;
    const visualY = SCREEN_H - 42 - scaledH;

    return { x: player.x - scaledW / 2, y: visualY, w: scaledW, h: scaledH };
  }

  function getObjectHitbox(o) {
    if (o.type === 'gold') {
      return { x: o.x, y: o.y, w: 31, h: 53 };
    }
    if (o.type === 'mouse') {
      return { x: o.x, y: o.y, w: 45, h: 63 };
    }
    return { x: o.x, y: o.y, w: o.w, h: o.h };
  }
  
  function hit(a,b) { return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y; }

  function collect(o, pts, now) {
    const fxX = o.x + o.w/2;
    const fxY = o.y + o.h/2;
    spawnPickupEffect(fxX, fxY, o.type); 
    releaseObject(o);
    score += pts;
    if (o.type === 'box' || o.type === 'gold') {
      supplyCount += 1;
      combo += 1;
      if (combo >= 3) showCombo(combo);
    }
  }

  let comboTimer=null, feverNoticeTimer=null;
  let isFeverNoticeActive=false;
  function showCombo(n) {
    if (isFeverNoticeActive) {
      comboCenter.classList.remove('show');
      clearTimeout(comboTimer);
      return;
    }
    comboNum.textContent = n;
    comboCenter.classList.remove('show'); void comboCenter.offsetWidth; comboCenter.classList.add('show');
    clearTimeout(comboTimer); comboTimer=setTimeout(()=>comboCenter.classList.remove('show'),720);
  }

  function spawnFeverAutoPickupEffect(x, y) {
    const wrapper = document.createElement('div');
    wrapper.className = 'feverAutoPickupWrapper';
    playArea.appendChild(wrapper);

    const fx = document.createElement('div');
    fx.className = 'feverAutoPickupEffect';
    const img = document.createElement('img');
    img.src = ASSETS.effect;
    fx.appendChild(img);
    wrapper.appendChild(fx);

    const startTime = performance.now();
    const duration = 220; 

    function updateAutoFx(timestamp) {
      const elapsed = timestamp - startTime;
      if (elapsed >= duration || !isStarted) {
        wrapper.remove();
        return;
      }
      const curScreenX = x - cameraX;
      wrapper.style.transform = `translate3d(${curScreenX}px, ${y}px, 0)`;
      requestAnimationFrame(updateAutoFx);
    }
    requestAnimationFrame(updateAutoFx);
  }

  function spawnSparklingParticles(worldX, worldY) {
    const particleCount = 15; 
    const brightYellow = '#F5F0CE'; 
    const moveDir = player.dir;

    for (let i = 0; i < particleCount; i++) {
      const p = document.createElement('div');
      p.style.position = 'absolute';
      p.style.left = '0px';
      p.style.top = '0px';
      p.style.pointerEvents = 'none';
      p.style.zIndex = '16'; 
      p.style.display = 'flex';
      p.style.alignItems = 'center';
      p.style.justifyContent = 'center';
      p.style.willChange = 'transform';
      
      const size = 11 + Math.random() * 8; 
      p.innerHTML = `
        <svg width="${size}" height="${size}" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" style="filter: drop-shadow(0 0 2px rgba(245,240,206,0.75));">
          <path d="M50 0C50 35 65 50 100 50C65 50 50 65 50 100C50 65 35 50 0 50C35 50 50 35 50 0Z" fill="${brightYellow}"/>
        </svg>
      `;
      
      playArea.appendChild(p);
      
      const spreadMultiplier = 1.5;
      const realDir = (moveDir === 0) ? (Math.random() < 0.5 ? -1 : 1) : moveDir;
      
      let vx = -realDir * (1.8 + Math.random() * 3.6) + (Math.random() - 0.5) * 1.8 * spreadMultiplier;
      let vy = - (3.5 + Math.random() * 4.0) + (Math.random() - 0.5) * 2.5 * spreadMultiplier; 
      
      let relativeX = 0;
      let relativeY = 0;
      let opacity = 1.0;
      let scale = 1.0;
      
      const startTime = performance.now();
      const lifetime = 400 + Math.random() * 150; 
      
      function updateParticle(timestamp) {
        const elapsed = timestamp - startTime;
        if (elapsed >= lifetime || !isStarted) {
          p.remove();
          return;
        }
        
        const t = elapsed / lifetime;
        
        let currentOpacity = 0;
        let currentScale = 0.5;
        const peakT = 0.25; 
        
        if (t < peakT) {
          const ratio = t / peakT;
          currentOpacity = ratio;
          currentScale = 0.5 + ratio * 0.5;
        } else {
          const ratio = (t - peakT) / (1.0 - peakT);
          currentOpacity = 1.0 - ratio;
          currentScale = 1.0 + ratio * 0.2;
        }
        
        vy += 0.22;
        
        relativeX += vx;
        relativeY += vy;
        
        const screenX = (worldX + relativeX) - cameraX;
        const screenY = worldY + relativeY;
        
        p.style.transform = `translate3d(${screenX}px, ${screenY}px, 0) scale(${currentScale})`;
        p.style.opacity = currentOpacity;
        
        requestAnimationFrame(updateParticle);
      }
      requestAnimationFrame(updateParticle);
    }
  }

  function spawnPickupEffect(x, y, type) {
    const scaleFactor = isFever ? 2 : 1;
    const playerWorldCenterX = player.x;
    const playerWorldCenterY = (SCREEN_H - 42) - (player.h * scaleFactor) / 2;

    const spawnWorldX = playerWorldCenterX;
    const spawnWorldY = playerWorldCenterY - 35; 

    const wrapper = document.createElement('div');
    wrapper.className = 'pickupEffectWrapper';
    playArea.appendChild(wrapper);

    const fx = document.createElement('div');
    fx.className = 'pickupEffect';
    const img = document.createElement('img');
    img.src = ASSETS.effect;
    fx.appendChild(img);
    wrapper.appendChild(fx);

    spawnSparklingParticles(spawnWorldX, spawnWorldY);

    const startTime = performance.now();
    const duration = 350; 

    function updatePickupWrapper(timestamp) {
      const elapsed = timestamp - startTime;
      if (elapsed >= duration || !isStarted) {
        wrapper.remove();
        return;
      }
      const curScreenX = spawnWorldX - cameraX;
      wrapper.style.transform = `translate3d(${curScreenX}px, ${spawnWorldY}px, 0)`;
      requestAnimationFrame(updatePickupWrapper);
    }
    requestAnimationFrame(updatePickupWrapper);
  }

  function endGame() {
    isGameOver=true; isStarted=false; if (raf) cancelAnimationFrame(raf);
    stopBgm();
    setGameBackgroundMode(false);
    objects.forEach(releaseObject); objects=[];
    $('finalSupplyCount').textContent = supplyCount;
    const finalComboCount = $('finalComboCount');
    const finalFeverCount = $('finalFeverCount');
    if (finalComboCount) finalComboCount.textContent = combo + '개';
    if (finalFeverCount) finalFeverCount.textContent = feverCount + '회';
    clearTimeout(hitVisualTimer);
    isHitVisual = false;
    playerEl.classList.remove('hit');
    playerEl.style.display = 'none';
    playerImg.style.display = 'none';
    $('gameScreen').classList.add('resultMode');
    $('result').classList.add('active');
  }

  function ensureAudio() {
    if (audioCtx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    audioCtx = new AC();
    masterGain = audioCtx.createGain();
    masterGain.gain.value = 0.045;
    masterGain.connect(audioCtx.destination);
  }

  function startBgm() {
    ensureAudio();
    if (!audioCtx || !masterGain) return;
    if (audioCtx.state === 'suspended') audioCtx.resume();
    if (isAudioReady) return;
    isAudioReady = true;
    bgmStep = 0;
    musicTimer = setInterval(playBgmStep, 285);
    playBgmStep();
  }

  function stopBgm() {
    if (musicTimer) clearInterval(musicTimer);
    musicTimer = null; isAudioReady = false;
    if (masterGain && audioCtx) {
      masterGain.gain.cancelScheduledValues(audioCtx.currentTime);
      masterGain.gain.setTargetAtTime(0.0001, audioCtx.currentTime, 0.08);
    }
  }

  function setBgmFever(on) {
    if (!audioCtx || !masterGain) return;
    const t = audioCtx.currentTime;
    masterGain.gain.cancelScheduledValues(t);
    masterGain.gain.setTargetAtTime(on ? 0.075 : 0.045, t, 0.05);
  }

  function playTone(freq, duration=0.16, type='sine', gain=0.055) {
    if (!audioCtx || !masterGain) return;
    const t = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = type; osc.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(gain, t + 0.018);
    g.gain.exponentialRampToValueAtTime(0.0001, t + duration);
    osc.connect(g); g.connect(masterGain);
    osc.start(t); osc.stop(t + duration + 0.04);
  }

  function playBgmStep() {
    if (!audioCtx || !masterGain || !isAudioReady || isGameOver) return;
    const base = bgmNotes[bgmStep % bgmNotes.length];
    const octave = isFever ? 2 : 1;
    playTone(base * octave, isFever ? 0.13 : 0.18, isFever ? 'triangle' : 'sine', isFever ? 0.047 : 0.035);
    if (bgmStep % 4 === 0) playTone(base / 2, 0.32, 'sine', 0.024);
    bgmStep++;
  }

  function playFeverSfx() {
    if (!audioCtx) return;
    [523.25, 659.25, 783.99, 1046.5].forEach((f, i)=>setTimeout(()=>playTone(f, 0.12, 'triangle', 0.06), i*55));
  }

  window.addEventListener('keydown', e=>{
    if (e.key==='ArrowLeft'||e.key==='a'||e.key==='A') { keyLeft=true; e.preventDefault(); }
    if (e.key==='ArrowRight'||e.key==='d'||e.key==='D') { keyRight=true; e.preventDefault(); }
  });
  window.addEventListener('keyup', e=>{
    if (e.key==='ArrowLeft'||e.key==='a'||e.key==='A') keyLeft=false;
    if (e.key==='ArrowRight'||e.key==='d'||e.key==='D') keyRight=false;
  });

  const activePointers = {};

  function updateMovementFromPointers() {
    const ids = Object.keys(activePointers);
    if (ids.length === 0) {
      keyLeft = false;
      keyRight = false;
      return;
    }
    const lastId = ids[ids.length - 1];
    const clientX = activePointers[lastId];
    
    const rect = phoneEl.getBoundingClientRect();
    const midX = rect.left + rect.width / 2;
    if (clientX < midX) {
      keyLeft = true;
      keyRight = false;
    } else {
      keyLeft = false;
      keyRight = true;
    }
  }

  playArea.addEventListener('pointerdown', e => {
    e.preventDefault();
    if (!isStarted || isGameOver) return;
    activePointers[e.pointerId] = e.clientX;
    updateMovementFromPointers();
  });

  playArea.addEventListener('pointermove', e => {
    e.preventDefault();
    if (!isStarted || isGameOver) return;
    if (activePointers[e.pointerId] !== undefined) {
      activePointers[e.pointerId] = e.clientX;
      updateMovementFromPointers();
    }
  });

  playArea.addEventListener('pointerup', e => {
    e.preventDefault();
    delete activePointers[e.pointerId];
    updateMovementFromPointers();
  });

  playArea.addEventListener('pointercancel', e => {
    e.preventDefault();
    delete activePointers[e.pointerId];
    updateMovementFromPointers();
  });

  playArea.addEventListener('touchstart', e => {
    const now = Date.now();
    if (now - lastTouchTime < 300) {
      e.preventDefault();
    }
    lastTouchTime = now;
  }, { passive: false });

  // ★ [V80 동선 연결] 각 버튼 클릭 핸들러 및 화면 흐름 매핑
  $('btnGameStart').onclick = () => {
    show('gameScreen');
    startGame();
  };
  
  $('retryBtn').onclick = () => {
    show('eventScreen');
  };
  
  $('btnEventClose').onclick = () => {
    show('lobbyScreen');
  };
  
  $('mainBtn').onclick = () => {
    show('gameScreen');
    startGame();
  };

  $('quitBtn').onclick = endGame;
  $('completeBtn').onclick = () => show('complete');
  $('againBtn').onclick = () => show('lobbyScreen');

  updatePhoneScale();
  // 로딩 시 첫 화면은 lobbyScreen으로 가도록 초기 설정 유지 (게임 자동시작 Suspended)
  show('lobbyScreen');
})();
</script>
